server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API -> contenedor del backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # SPA: cualquier ruta desconocida devuelve index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
