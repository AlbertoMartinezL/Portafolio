services:
  backend:
    build: ./backend
    env_file: ./backend/.env.example
    ports:
      - "8000:8000"
    # Monta el código y los JSON en vivo: los cambios se ven sin reconstruir la imagen
    volumes:
      - ./backend/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
